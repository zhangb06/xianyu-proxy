[project]
name = "xianyu-lite"
version = "0.1.0"
description = "闲鱼多账号托管、自动回复与自动发货（单进程精简版）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "websockets>=13,<18",
    "msgpack>=1.0.8,<2",
    "qrcode[pil]>=7.4,<9",
    "cryptography>=42,<47",
    "aiosqlite>=0.20,<1",
    "pydantic-settings>=2.4,<3",
    "loguru>=0.7.2,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.47,<2"]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
